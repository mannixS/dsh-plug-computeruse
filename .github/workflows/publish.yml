name: Publish to npm

# Publishes when a version tag is pushed, e.g.:
#   git tag -a v1.3.2 -m "v1.3.2"
#   git push origin v1.3.2
#
# A tag push is deliberate, so an ordinary commit on main never publishes.
# The job also refuses to publish when the tag and package.json disagree.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC: required for npm trusted publishing and provenance

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # A tag/version mismatch would publish the wrong release, and npm cannot
      # overwrite a version once it exists.
      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag=$tag version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # The published tarball is the whole product; a broken module must never
      # reach the registry.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check
        run: pnpm run check

      - name: Unit tests
        run: pnpm test

      - name: Check the package contents
        run: |
          pnpm pack --dry-run
          # A stale node_modules must never be packed.
          if pnpm pack --dry-run 2>&1 | grep -q 'node_modules'; then
            echo "::error::The package would include node_modules"
            exit 1
          fi

      - name: Publish
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summarize
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "Published \`dsh-plug-computeruse@$version\` to npm." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://www.npmjs.com/package/dsh-plug-computeruse" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://www.npmjs.com/package/dsh-plug-computeruse/v/$version" >> "$GITHUB_STEP_SUMMARY"
